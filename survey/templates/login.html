{% extends 'base.html' %}

{% block title %}Sign In — SurveyNexus{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-card animate-slide-up">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h2>Login</h2>
            <p>Login to view survey results.</p>
        </div>

        {% if form.errors %}
            <div class="auth-error-box animate-fade-in" role="alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Invalid username or password.</span>
            </div>
        {% endif %}

        <form method="POST" novalidate>
            {% csrf_token %}

            <!-- Username Field -->
            <div class="form-group">
                <label for="id_username" class="form-label">Username</label>
                <input type="text" 
                       name="username" 
                       autofocus 
                       autocapitalize="none" 
                       autocomplete="username" 
                       maxlength="150" 
                       required 
                       id="id_username" 
                       class="form-input" 
                       placeholder="Enter your username">
            </div>

            <!-- Password Field with Toggle -->
            <div class="form-group">
                <label for="id_password" class="form-label">Password</label>
                <div class="password-field-wrapper">
                    <input type="password" 
                           name="password" 
                           autocomplete="current-password" 
                           required 
                           id="id_password" 
                           class="form-input" 
                           placeholder="Enter your password">
                    <button type="button" class="password-toggle-btn" id="passwordToggleBtn" aria-label="Toggle password visibility">
                        <!-- Eye Icon (visible by default) -->
                        <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <!-- Eye Off Icon (hidden by default) -->
                        <svg class="eye-off-icon" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Hidden Next Parameter for redirect -->
            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="btn btn-primary btn-block">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
                Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
